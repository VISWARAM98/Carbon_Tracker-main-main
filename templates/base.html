<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EmittiF.iO - Carbon Management Platform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    <style>
        .font-orbitron { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .font-exo { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* Remove glow effects completely */
        .glow-text { text-shadow: none; }
        .neon-border { 
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Force transparent background for floating container */
        .floating-background {
            background: transparent !important;
            background-color: transparent !important;
        }

        /* Clean typography for body */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Navigation Styles */
        .nav-gradient {
            background: linear-gradient(135deg, #0F3B2E 0%, #1A5C48 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nav-link-custom {
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }
        
        .nav-link-custom:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .nav-link-custom.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
            font-weight: 600;
        }
        
        .dropdown-menu-custom {
            background: linear-gradient(135deg, #0F3B2E 0%, #1A5C48 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .dropdown-item-custom {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        .dropdown-item-custom:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .brand-text {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10B981 0%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-exo">
   
    <!-- Floating Elements - Individual elements only, no container background -->
    <div class="floating-background fixed inset-0 pointer-events-none z-0">
        <!-- Individual floating elements without container backgrounds -->
        <div class="absolute bottom-10 left-10 w-20 h-20 float-free-1 gentle-scale">
            <div class="w-full h-full rounded-full bg-emerald-500/10">
                <i class="fas fa-leaf text-emerald-400 text-2xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
            </div>
        </div>

        <div class="absolute top-20 right-20 w-16 h-16 float-free-2 gentle-scale" style="animation-delay: 1.5s;">
            <div class="w-full h-full rounded-full bg-cyan-500/10">
                <i class="fas fa-tree text-cyan-400 text-xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
            </div>
        </div>

        <div class="absolute top-1/3 left-1/4 w-12 h-12 float-free-3 gentle-scale" style="animation-delay: 3s;">
            <div class="w-full h-full rounded-full bg-teal-500/10">
                <i class="fas fa-water text-teal-400 text-lg absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
            </div>
        </div>
    </div>

    <!-- Main Content - Added padding-top for navigation -->
    <main class="relative z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="fixed top-24 right-6 z-50 space-y-2">
                {% for category, message in messages %}
                    <div class="bg-{% if category == 'error' %}red-500{% else %}emerald-500{% endif %} text-white px-6 py-3 rounded-xl shadow-lg font-exo animate-fade-in">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple hover effect for dropdowns
        document.addEventListener('DOMContentLoaded', function() {
            const dropdowns = document.querySelectorAll('.group');
            dropdowns.forEach(dropdown => {
                dropdown.addEventListener('mouseenter', function() {
                    const menu = this.querySelector('.dropdown-menu-custom');
                    if (menu) {
                        menu.classList.remove('invisible', 'opacity-0');
                        menu.classList.add('visible', 'opacity-100');
                    }
                });
                
                dropdown.addEventListener('mouseleave', function() {
                    const menu = this.querySelector('.dropdown-menu-custom');
                    if (menu) {
                        setTimeout(() => {
                            menu.classList.remove('visible', 'opacity-100');
                            menu.classList.add('invisible', 'opacity-0');
                        }, 300);
                    }
                });
            });
            
            // Set active nav link based on current page
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-link-custom').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
