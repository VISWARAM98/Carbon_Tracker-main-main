{% extends "base.html" %}

{% block title %}Login - EmittiF.io{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background elements -->
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiMxOTFiMTkiIGZpbGwtb3BhY2l0eT0iMC4xIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMwIiByPSIyIi8+PC9nPjwvZz48L3N2Zz4=')] opacity-20"></div>
    <div class="absolute bottom-10 left-10 w-20 h-20 rounded-full bg-teal-500/10 float-animation"></div>
    <div class="absolute top-20 right-20 w-16 h-16 rounded-full bg-green-500/10 float-animation" style="animation-delay: 2s;"></div>
    
    <div class="max-w-md w-full space-y-8 z-10">
        <div>
            <div class="flex justify-center">
                <a href="{{ url_for('index') }}" class="flex items-center space-x-2">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-r from-teal-400 to-green-500 flex items-center justify-center">
                        <i class="fas fa-leaf text-white text-2xl"></i>
                    </div>
                </a>
            </div>
            <h2 class="mt-6 text-center text-3xl font-orbitron font-bold">
                Sign in to your account
            </h2>
            <p class="mt-2 text-center text-sm text-gray-400 font-exo">
                Or <a href="{{ url_for('register') }}" class="font-medium text-teal-400 hover:text-teal-300 transition-colors duration-300">create a new account</a>
            </p>
        </div>
        <form class="mt-8 space-y-6" action="{{ url_for('login') }}" method="POST">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required class="appearance-none rounded-t-lg relative block w-full px-3 py-3 border border-gray-700 bg-gray-800 placeholder-gray-500 text-white focus:outline-none focus:ring-teal-500 focus:border-teal-500 focus:z-10 sm:text-sm font-exo transition-all duration-300" placeholder="Username">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none rounded-b-lg relative block w-full px-3 py-3 border border-gray-700 bg-gray-800 placeholder-gray-500 text-white focus:outline-none focus:ring-teal-500 focus:border-teal-500 focus:z-10 sm:text-sm font-exo transition-all duration-300" placeholder="Password">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-teal-500 focus:ring-teal-500 border-gray-700 rounded bg-gray-800">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-300 font-exo">
                        Remember me
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-teal-400 hover:text-teal-300 transition-colors duration-300 font-exo">
                        Forgot your password?
                    </a>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-teal-500 to-green-600 hover:from-teal-600 hover:to-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition-all duration-300 hover-lift font-exo font-bold">
                    Sign in
                </button>
            </div>
            
            <!-- Demo Credentials -->
            <div class="mt-6 p-4 bg-gray-800/50 rounded-lg border border-teal-500/30">
                <p class="text-sm text-gray-300 font-exo text-center">
                    <strong>Demo Credentials:</strong><br>
                    Username: <span class="text-teal-400">admin</span><br>
                    Password: <span class="text-teal-400">password</span>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
